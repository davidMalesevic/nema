[package]
name = "nema-core"
version = "0.1.5"
edition.workspace = true

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "5"
hex = "0.4"
keyring = { version = "3", default-features = false, features = ["crypto-rust"] }
lopdf = "0.47.0"
pdfium-render = "0.9.5"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rand = "0.8"
rand_chacha = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
zip = "2"
zeroize = "1"

# Plattformspezifische Keyring-Backends: Auf Linux bewusst das Secret-Service-
# Backend (gnome-keyring/KWallet via D-Bus) statt des keyutils-Default-Backends,
# das in Containern/Sessions den Key nicht persistiert.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
