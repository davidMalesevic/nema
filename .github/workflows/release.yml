name: Release

# Baut bei jedem Tag `v*` die Downloads für Linux, Windows und macOS
# und hängt sie an ein GitHub-Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 statt latest: das AppImage läuft dann auch auf älteren Distributionen (glibc)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pdfium_asset: pdfium-linux-x64.tgz
            pdfium_lib: lib/libpdfium.so
            artifact: nema-linux-x86_64.AppImage
            kind: appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pdfium_asset: pdfium-win-x64.tgz
            pdfium_lib: bin/pdfium.dll
            artifact: nema-windows-x64.zip
            kind: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            pdfium_asset: pdfium-mac-univ.tgz
            pdfium_lib: lib/libpdfium.dylib
            artifact: nema-macos-universal.dmg
            kind: dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux-Abhängigkeiten
        if: matrix.kind == 'appimage'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libdbus-1-dev libxkbcommon-dev libwayland-dev pkg-config

      - name: PDFium-Bibliothek laden
        shell: bash
        run: |
          curl -fL -o pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/${{ matrix.pdfium_asset }}"
          mkdir -p pdfium && tar xzf pdfium.tgz -C pdfium
          ls -la pdfium

      - name: Kern-Tests
        run: cargo test -p nema-core

      - name: Bauen
        run: cargo build --release -p nema-app --target ${{ matrix.target }}

      - name: Bauen (macOS Intel) und Universal-Binary
        if: matrix.kind == 'dmg'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release -p nema-app --target x86_64-apple-darwin
          mkdir -p universal
          lipo -create -output universal/nema-app \
            target/aarch64-apple-darwin/release/nema-app \
            target/x86_64-apple-darwin/release/nema-app
          lipo -info universal/nema-app

      - name: Paketieren
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ matrix.kind }}" = "appimage" ]; then
            mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/icons/hicolor/256x256/apps
            cp target/${{ matrix.target }}/release/nema-app AppDir/usr/bin/
            cp pdfium/${{ matrix.pdfium_lib }} AppDir/usr/lib/
            cp packaging/AppRun AppDir/AppRun && chmod +x AppDir/AppRun
            cp packaging/nema.desktop AppDir/
            cp packaging/nema.png AppDir/nema.png
            cp packaging/nema.png AppDir/usr/share/icons/hicolor/256x256/apps/nema.png
            curl -fL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x appimagetool
            APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool AppDir dist/${{ matrix.artifact }}
          elif [ "${{ matrix.kind }}" = "zip" ]; then
            mkdir -p pkg/Nema
            cp target/${{ matrix.target }}/release/nema-app.exe pkg/Nema/Nema.exe
            cp pdfium/${{ matrix.pdfium_lib }} pkg/Nema/pdfium.dll
            (cd pkg && 7z a -tzip ../dist/${{ matrix.artifact }} Nema)
          else
            # macOS: richtiges App-Bundle, damit ein Doppelklick kein Terminal öffnet
            APP=pkg/Nema.app
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            cp universal/nema-app "$APP/Contents/MacOS/nema-app"
            cp pdfium/${{ matrix.pdfium_lib }} "$APP/Contents/MacOS/libpdfium.dylib"
            VERSION=$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)
            sed "s/@VERSION@/$VERSION/g" packaging/Info.plist > "$APP/Contents/Info.plist"
            mkdir nema.iconset
            for s in 16 32 128 256 512; do
              sips -z $s $s packaging/nema-1024.png --out nema.iconset/icon_${s}x${s}.png >/dev/null
              sips -z $((s*2)) $((s*2)) packaging/nema-1024.png --out nema.iconset/icon_${s}x${s}@2x.png >/dev/null
            done
            iconutil -c icns nema.iconset -o "$APP/Contents/Resources/nema.icns"
            # Ad-hoc-Signatur: ohne sie startet die App auf Apple-Silicon-Macs nicht
            codesign --force --deep --sign - "$APP"
            ln -s /Applications pkg/Applications
            hdiutil create -volname Nema -srcfolder pkg -ov -format UDZO dist/${{ matrix.artifact }}
          fi
          ls -la dist

      - name: Selbsttest (PDFium wird gefunden)
        if: matrix.kind == 'appimage'
        run: APPIMAGE_EXTRACT_AND_RUN=1 dist/${{ matrix.artifact }} --check-pdfium

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
